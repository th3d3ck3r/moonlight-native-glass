name: Native helper ordinary shutdown core probe
on:
  push:
    branches: [native-ui]
    paths: [.github/workflows/native-shutdown-probe.yml, tests/native/lldb_shutdown_probe.py]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Obtain packaged helper without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37878107640 -R th3d3ck3r/moonlight-native-glass -n Native-Glass-Preview-16-universal -D build/probe-artifact
          unzip -q build/probe-artifact/Moonlight-Native-Glass-Preview-16-universal.zip -d build/probe
      - name: Exercise ordinary shutdowns and inspect original core dumps
        env:
          MOONLIGHT_NATIVE_SHUTDOWN_CYCLES: '2000'
        run: |
          # Keep the helper uninstrumented. Capture its original process state
          # only if the OS observes a fatal signal, without a retry or injection.
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          ulimit -c unlimited
          helper="$PWD/build/probe/Moonlight Native Glass.app/Contents/Helpers/MoonlightEngine.app/Contents/MacOS/Moonlight"
          status=0
          python tests/native/bridge_smoke.py "$helper" > build/ordinary-shutdown.log 2>&1 || status=$?
          tail -n 90 build/ordinary-shutdown.log
          if [ "$status" -ne 0 ]; then
            for core in /cores/core.*; do
              if [ -f "$core" ]; then
                lldb --batch --core "$core" -o 'thread backtrace all' -o 'image list' "$helper" >> build/ordinary-crash.txt 2>&1 || true
              fi
            done
            /usr/bin/log show --last 5m --style compact --predicate 'process == "Moonlight"' > build/ordinary-system.log 2>&1 || true
            if [ -f build/ordinary-crash.txt ]; then cat build/ordinary-crash.txt; fi
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-shutdown-diagnostics
          path: |
            build/ordinary-shutdown.log
            build/ordinary-crash.txt
            build/ordinary-system.log
          retention-days: 7
