name: Native presentation shutdown regression
on:
  push:
    branches: [feature/native-boot-animation]
    paths: [.github/workflows/native-shutdown-probe.yml, tests/native/NativeShutdownTests.mm, tests/native/extract_native_exit_shortcut.py, app/native/nativeapplication.mm, app/native/nativeoverlay.mm, app/native/nativeoverlay.h, app/streaming/input/keyboard.cpp, app/streaming/session.cpp]
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Test real SDL/AppKit teardown and deferred callbacks
        run: |
          python3 setup-deps.py
          mkdir -p build
          python3 tests/native/extract_native_exit_shortcut.py
          xcrun clang++ -std=c++17 -fno-objc-arc -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I libs/mac/include/SDL2 -I app/native -I build \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/NativeShutdownTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/native-shutdown-tests
          ASAN_OPTIONS=detect_leaks=0 build/native-shutdown-tests
