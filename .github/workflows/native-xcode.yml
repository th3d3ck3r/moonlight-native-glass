name: MoonlightLG Xcode Project Validation
on:
  push:
    branches: [native-ui, feature/native-boot-animation, feature/recording-plugin]
    paths:
      - 'MoonlightLG.xcodeproj/**'
      - 'macos-native/**'
      - 'recording/**'
      - 'scripts/build-recorder-plugin.py'
      - 'app/native/**'
      - 'app/streaming/input/**'
      - 'tests/native/OverlayTests.mm'
      - 'tests/native/StreamWindowTests.mm'
      - 'tests/native/extract_native_focus_methods.py'
      - 'tests/native/NativeUIScreensTests.swift'
      - 'tests/native/BootPlaybackTests.swift'
      - 'scripts/build-xcode-engine.py'
      - 'scripts/xcode-python.json'
      - 'scripts/xcode-submodules.json'
      - 'tests/native/check_bundle.py'
      - '.github/workflows/native-xcode.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-xcode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xcode:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        # Deliberately leave submodules uninitialized: the Xcode build owns setup.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Validate shared project and schemes
        run: |
          plutil -lint MoonlightLG.xcodeproj/project.pbxproj
          xcodebuild -list -project MoonlightLG.xcodeproj
      - name: Build the full app from a fresh checkout
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
        run: |
          xcodebuild -project MoonlightLG.xcodeproj -scheme 'MoonlightLG' -configuration Debug -destination 'platform=macOS' -derivedDataPath build/xcode-main ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
          codesign --verify --deep --strict --verbose=2 build/xcode-main/Build/Products/Debug/MoonlightLG.app
          python3 tests/native/check_bundle.py build/xcode-main/Build/Products/Debug/MoonlightLG.app universal
      - name: Verify incremental full-app build
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
        run: |
          xcodebuild -project MoonlightLG.xcodeproj -scheme 'MoonlightLG' -configuration Debug -destination 'platform=macOS' -derivedDataPath build/xcode-main ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
      - name: Test the embedded real engine
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
        run: |
          python3 tests/native/connection_window_bridge.py build/xcode-main/Build/Products/Debug/MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/MacOS/Moonlight
          python3 tests/native/bridge_smoke.py build/xcode-main/Build/Products/Debug/MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/MacOS/Moonlight
      - name: Verify source ZIP dependency setup
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
        run: |
          mkdir -p build/source-zip
          git archive HEAD | tar -x -C build/source-zip
          /usr/bin/python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess
          root = pathlib.Path('build/source-zip').resolve()
          spec = importlib.util.spec_from_file_location('zip_setup', root / 'scripts/build-xcode-engine.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.prepare_sources()
          for entry in json.loads((root / 'scripts/xcode-submodules.json').read_text()):
              actual = subprocess.check_output(['git', '-C', str(root / entry['path']), 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == entry['commit'], entry['path']
          print('Source ZIP recovered every pinned submodule without manual setup')
          PY
      - name: Build the startup preview scheme without the engine
        run: |
          xcodebuild -project MoonlightLG.xcodeproj -scheme 'MoonlightLG Startup Preview' -configuration Preview -destination 'platform=macOS' -derivedDataPath build/xcode-preview build
          test ! -d build/xcode-preview/Build/Products/Preview/MoonlightLG.app/Contents/Helpers
      - name: Test the root project's UI preview scheme
        run: |
          xcodebuild -project MoonlightLG.xcodeproj -scheme 'MoonlightLG UI Preview' -destination 'platform=macOS' -derivedDataPath build/xcode-preview -resultBundlePath build/xcode-preview.xcresult test
      - name: Export UI captures
        if: always()
        run: |
          mkdir -p build/xcode-captures
          if [ -d build/xcode-preview.xcresult ]; then xcrun xcresulttool export attachments --path build/xcode-preview.xcresult --output-path build/xcode-captures; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Xcode-Project-UI-Captures
          path: build/xcode-captures/*
          if-no-files-found: warn
