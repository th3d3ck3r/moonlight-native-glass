name: Publish MoonlightLG Experimental Build
on:
  push:
    branches: [feature/native-boot-animation]
    paths: [.github/workflows/publish-native-preview.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATED_SHA: 4d8ee8a4bab531aaa43ee7a9ccef6b51f8f08053
      BUILD_RUN: '38219537762'
      XCODE_RUN: '38219537999'
      RELEASE_TAG: native-glass-experimental-24
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact source, complete builds and Xcode validation
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          gh api "repos/$GH_REPO/actions/runs/$XCODE_RUN" > /tmp/xcode-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > /tmp/build-jobs.json
          python3 - <<'PY'
          import json, os
          sha = os.environ['VALIDATED_SHA']
          for path, name in [('/tmp/build-run.json', 'Native macOS Validation'), ('/tmp/xcode-run.json', 'Native Xcode Project Validation')]:
              run = json.load(open(path))
              assert run['head_sha'] == sha and run['head_branch'] == 'feature/native-boot-animation'
              assert run['status'] == 'completed' and run['conclusion'] == 'success' and run['name'] == name
          jobs = json.load(open('/tmp/build-jobs.json'))['jobs']
          for name in ['build (x86_64)', 'build (universal)', 'Native UI window smoke test']:
              matches = [j for j in jobs if j['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', name
          universal = next(j for j in jobs if j['name'] == 'build (universal)')
          for name in ['Test actual SDL stream window hide and restore', 'Audit native window and input lifetime with sanitizers', 'Test actual menu bar icon state', 'Test real engine bridge and persistence']:
              assert any(s['name'] == name and s['conclusion'] == 'success' for s in universal['steps']), name
          PY
          git fetch --no-tags --depth=1 origin "$VALIDATED_SHA"
          git diff --name-only "$VALIDATED_SHA" "$GITHUB_SHA" > /tmp/release-changes.txt
          python3 - <<'PY'
          paths = open('/tmp/release-changes.txt').read().splitlines()
          assert all(p == 'README.md' or p.startswith(('docs/', 'readme-assets/', '.github/workflows/')) for p in paths), paths
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feature/native-boot-animation" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; refusing to replace it.' >&2; exit 1; fi
      - name: Download and verify previously validated packages and captures
        run: |
          mkdir -p release-assets capture-assets overlay-assets
          gh run download "$BUILD_RUN" -n Native-Glass-Preview-24-x86_64 -D release-assets
          gh run download "$BUILD_RUN" -n Native-Glass-Preview-24-universal -D release-assets
          gh run download "$BUILD_RUN" -n Native-UI-Quick-Window-Captures -D capture-assets
          gh run download "$BUILD_RUN" -n Native-Stream-Overlay-Previews -D overlay-assets
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('release-assets')
          expected = {'x86_64': 'edc02dd8dddf22e9fc79e8a354505dccd247469c611f8939f7f6c73f0d468b8f', 'universal': '5938eb296def4d2fd4b4d5434ab1ccea8ef322c1e1d626741032620ac5e0edbb'}
          for arch, checksum in expected.items():
              package = root / ('Moonlight-Native-Glass-Preview-24-' + arch + '.zip')
              assert (root / ('SHA256-' + arch + '.txt')).read_text().split()[0] == checksum
              with package.open('rb') as stream: assert hashlib.file_digest(stream, 'sha256').hexdigest() == checksum
              package.rename(root / ('Moonlight-Native-Glass-Experimental-24-' + arch + '.zip'))
          source = pathlib.Path('capture-assets')
          attachments = [a for test in json.loads((source / 'manifest.json').read_text()) for a in test['attachments']]
          for name in ['main-dark', 'main-compact', 'settings-video', 'settings-audio', 'settings-input', 'settings-network', 'settings-advanced', 'settings-overlay', 'settings-shortcuts', 'about-dark', 'menu-bar', 'crimson-settings-titlebar', 'native-startup-warp', 'native-startup-moon-and-satellites']:
              matches = [a for a in attachments if a['suggestedHumanReadableName'].startswith(name + '_0_')]
              assert len(matches) == 1, name
              shutil.copyfile(source / matches[0]['exportedFileName'], root / (name + '.png'))
          shutil.copyfile('overlay-assets/overlay-controls-dark.png', root / 'overlay-controls-dark.png')
          PY
          (cd release-assets && sha256sum Moonlight-Native-Glass-Experimental-24-*.zip > SHA256SUMS.txt)
      - name: Publish experimental pre-release with verified assets
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'Moonlight Native Glass · Experimental Build 24 · Crimson Glass' \
            --notes-file docs/EXPERIMENTAL_24_RELEASE_NOTES.md \
            release-assets/*.zip release-assets/SHA256SUMS.txt release-assets/*.png
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
