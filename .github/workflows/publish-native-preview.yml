name: Publish Native Glass Preview
on:
  push:
    branches: [native-ui]
    paths: [.github/workflows/publish-native-preview.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: f2531af7983233ec3e67ff908fb288e87f3f8338
      BUILD_RUN: '37703084469'
      VALIDATED_SHA: f2531af7983233ec3e67ff908fb288e87f3f8338
      VALIDATED_RUN: '37703084469'
      RELEASE_TAG: native-glass-6.2-preview-6
    steps:
      - uses: actions/checkout@v5
      - name: Verify the exact validated source and all required jobs
        run: |
          gh api "repos/$GH_REPO/actions/runs/$VALIDATED_RUN" > /tmp/validated-run.json
          jq -e --arg sha "$VALIDATED_SHA" '.head_sha == $sha and .head_branch == "native-ui" and .conclusion == "success" and .name == "Native macOS Validation"' /tmp/validated-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .head_branch == "native-ui" and .status == "completed" and .name == "Native macOS Validation"' /tmp/build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > /tmp/build-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$VALIDATED_RUN/jobs?per_page=100" > /tmp/validated-jobs.json
          python3 - <<'PY'
          import json
          build_jobs = json.load(open('/tmp/build-jobs.json'))['jobs']
          ui_jobs = json.load(open('/tmp/validated-jobs.json'))['jobs']
          for name, jobs in [('build (x86_64)', build_jobs), ('build (universal)', build_jobs), ('Native UI window smoke test', ui_jobs)]:
              matches = [j for j in jobs if j['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', name
          universal = next(j for j in build_jobs if j['name'] == 'build (universal)')
          assert any(s['name'] == 'Test actual SDL stream window hide and restore' and s['conclusion'] == 'success' for s in universal['steps']), 'SDL lifecycle check missing'
          assert any(s['name'] == 'Test actual menu bar icon state' and s['conclusion'] == 'success' for s in universal['steps']), 'Menu bar icon check missing'

          PY
          # Publish the existing native-ui head only when every build input is
          # identical to the validated commit; later changes must be docs/workflows.
          git fetch --no-tags --depth=1 origin "$BUILD_SHA" "$VALIDATED_SHA"
          # Reuse full-build packages only when the later UI validation changes
          # tests/docs alone. Every application/resource/build input is identical.
          git diff --name-only "$BUILD_SHA" "$VALIDATED_SHA" > /tmp/ui-validation-changes.txt
          python3 - <<'PYINPUTS'
          paths = open('/tmp/ui-validation-changes.txt').read().splitlines()
          assert all(p == 'tests/native/NativeUIScreensTests.swift' or p.startswith('docs/') for p in paths), paths
          PYINPUTS
          git diff --name-only "$VALIDATED_SHA" "$GITHUB_SHA" > /tmp/release-changes.txt
          python3 - <<'PY'
          paths = open('/tmp/release-changes.txt').read().splitlines()
          assert all(p == 'README.md' or p.startswith(('docs/', 'readme-assets/', '.github/workflows/')) for p in paths), paths
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/heads/native-ui" --jq .object.sha)" = "$GITHUB_SHA"
          # Master now has a fork-specific README; its application code must
          # still match the original 6.2 baseline exactly.
          git fetch --no-tags --depth=1 origin master de2467e433821664cdd2224aad8c89a625be1ad9
          git diff --name-only de2467e433821664cdd2224aad8c89a625be1ad9 origin/master > /tmp/master-changes.txt
          python3 - <<'PYMASTER'
          assert all(p == 'README.md' for p in open('/tmp/master-changes.txt').read().splitlines()), 'Master application baseline changed'
          PYMASTER
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Preview already exists; refusing to replace it.' >&2; exit 1; fi
      - name: Download only previously validated artifacts
        run: |
          mkdir -p release-assets capture-assets
          gh run download "$BUILD_RUN" -n Native-Glass-Preview-6-x86_64 -D release-assets
          gh run download "$BUILD_RUN" -n Native-Glass-Preview-6-universal -D release-assets
          gh run download "$VALIDATED_RUN" -n Native-UI-Quick-Window-Captures -D capture-assets
          # Full-build layer images are diagnostics; publish composited XCTest images.
          rm -f release-assets/*.png
          python3 - <<'PY'
          import json, pathlib, shutil
          source = pathlib.Path('capture-assets')
          manifest = json.loads((source / 'manifest.json').read_text())
          attachments = [a for test in manifest for a in test['attachments']]
          for name in ['main-light', 'main-dark', 'main-compact', 'loading', 'settings-video', 'settings-audio', 'settings-input', 'settings-network', 'settings-advanced', 'about-dark', 'menu-bar']:
              matches = [a for a in attachments if a['suggestedHumanReadableName'].startswith(name + '_0_')]
              assert len(matches) == 1, name
              shutil.copyfile(source / matches[0]['exportedFileName'], pathlib.Path('release-assets') / (name + '.png'))
          PY
          (cd release-assets && sha256sum Moonlight-Native-Glass-Preview-6-*.zip > SHA256SUMS.txt)
      - name: Export small visual QA captures to the job log
        run: |
          python3 - <<'PYQA'
          import base64, pathlib
          for name in ['about-dark', 'menu-bar']:
              data = (pathlib.Path('release-assets') / (name + '.png')).read_bytes()
              print('NATIVE_UI_VISUAL_QA:' + name + ':' + base64.b64encode(data).decode('ascii'))
          PYQA
      - name: Publish the separately labeled preview
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title 'Moonlight Native Glass · Qt 6.2 · Native UI Preview 6' \
            --notes '' \
            release-assets/*.zip release-assets/SHA256SUMS.txt release-assets/*.png
