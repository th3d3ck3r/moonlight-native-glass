name: Publish MoonlightLG 1.3.7.1
on:
  push:
    branches: [feature/recording-plugin]
    paths: [.github/workflows/publish-native-preview.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-moonlightlg-stable
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[publish stable 1.3.7.1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.bundle.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATED_SHA: 22e329f252591b0c6b552ded511c6450b107a1ea
      BUILD_RUN: '42298180675'
      XCODE_RUN: '42298180681'
      RELEASE_TAG: moonlightlg-v1.3.7.1
      VERSION: '1.3.7.1'
    steps:
      - uses: actions/checkout@v5
      - name: Verify stable metadata and exact validated source
        run: |
          fetch_json() {
            local endpoint="$1" destination="$2"
            echo "Reading validation: $endpoint"
            for attempt in 1 2 3 4 5; do
              if gh api "$endpoint" > "$destination"; then return 0; fi
              echo "GitHub API read failed; retry $attempt/5" >&2
              sleep 5
            done
            return 1
          }
          for run in "$BUILD_RUN" "$XCODE_RUN"; do
            for attempt in $(seq 1 48); do
              fetch_json "repos/$GH_REPO/actions/runs/$run" "/tmp/$run.json"
              if test "$(jq -r .status "/tmp/$run.json")" = completed; then break; fi
              sleep 25
            done
            test "$(jq -r .conclusion "/tmp/$run.json")" = success
          done
          mv "/tmp/$BUILD_RUN.json" /tmp/build-run.json
          mv "/tmp/$XCODE_RUN.json" /tmp/xcode-run.json
          python3 - <<'PY'
          import json, os, plistlib
          info = plistlib.load(open('macos-native/Info.plist', 'rb'))
          assert info['MoonlightLGReleaseChannel'] == 'stable', 'U/E builds must not be published as stable'
          assert info['MoonlightLGVersion'] == os.environ['VERSION']
          assert info['CFBundleVersion'] == '61'
          for path, name in [('/tmp/build-run.json', 'MoonlightLG macOS Validation'), ('/tmp/xcode-run.json', 'MoonlightLG Xcode Project Validation')]:
              run = json.load(open(path))
              assert run['head_sha'] == os.environ['VALIDATED_SHA']
              assert run['head_branch'] == 'feature/recording-plugin'
              assert run['status'] == 'completed' and run['conclusion'] == 'success' and run['name'] == name
          PY
          git fetch --no-tags --depth=1 origin "$VALIDATED_SHA"
          git diff --name-only "$VALIDATED_SHA" "$GITHUB_SHA" > /tmp/release-changes.txt
          python3 - <<'PY'
          paths = open('/tmp/release-changes.txt').read().splitlines()
          assert paths == ['.github/workflows/publish-native-preview.yml'], paths
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feature/recording-plugin" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; refusing to replace it.' >&2; exit 1; fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release tag already exists; refusing to retarget it.' >&2; exit 1; fi
      - name: Download validated packages and verify checksums
        run: |
          mkdir -p release-assets capture-assets overlay-assets
          download_artifact() {
            local name="$1" destination="$2" temporary
            temporary=$(mktemp -d)
            for attempt in 1 2 3 4 5; do
              echo "Downloading $name (attempt $attempt/5)"
              if gh run download "$BUILD_RUN" -n "$name" -D "$temporary"; then
                cp -a "$temporary"/. "$destination"/
                rm -rf "$temporary"
                return 0
              fi
              rm -rf "$temporary"
              temporary=$(mktemp -d)
              sleep 8
            done
            rm -rf "$temporary"
            return 1
          }
          for arch in arm64; do
            download_artifact "MoonlightLG-$VERSION-$arch" release-assets
          done
          download_artifact "MoonlightLG-$VERSION-source" release-assets
          download_artifact Native-UI-Quick-Window-Captures capture-assets
          download_artifact Native-Stream-Overlay-Previews overlay-assets
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, shutil, struct, tarfile, zipfile
          root = pathlib.Path('release-assets')
          lines = []
          for arch in ['arm64', 'source']:
              ending = 'source.tar.gz' if arch == 'source' else arch + '.zip'
              package = root / f"MoonlightLG-{os.environ['VERSION']}-{ending}"
              recorded = (root / f'SHA256-{arch}.txt').read_text().split()
              assert len(recorded) == 2 and pathlib.Path(recorded[1]).name == package.name
              with package.open('rb') as source:
                  actual = hashlib.file_digest(source, 'sha256').hexdigest()
              assert actual == recorded[0], f'Checksum mismatch: {package}'
              lines.append(f'{actual}  {package.name}\n')
          (root / 'SHA256SUMS.txt').write_text(''.join(lines))
          with zipfile.ZipFile(root / f"MoonlightLG-{os.environ['VERSION']}-arm64.zip") as package:
              legal = 'MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/Resources/Legal/'
              for original, destination in [('GPL-3.0.txt', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.txt', 'THIRD_PARTY_NOTICES.txt'), ('SOURCES.json', 'SOURCE_MANIFEST.json')]:
                  (root / destination).write_bytes(package.read(legal + original))
          # Stream corresponding source once; verify every dependency archive.
          names, files, dependencies = set(), set(), {}
          source_info, inventory = None, None
          prefix = f"MoonlightLG-{os.environ['VERSION']}-source/"
          with tarfile.open(root / f"MoonlightLG-{os.environ['VERSION']}-source.tar.gz", mode='r|gz') as source:
              for member in source:
                  names.add(member.name)
                  if not member.isfile(): continue
                  files.add(member.name)
                  assert member.name.startswith(prefix), member.name
                  name = member.name[len(prefix):]
                  if name == 'SOURCE_INFORMATION.txt':
                      source_info = source.extractfile(member).read().decode()
                  elif name == 'third-party-source/SOURCES.json':
                      inventory = json.load(source.extractfile(member))
                  elif name.startswith('third-party-source/'):
                      digest = hashlib.sha256()
                      with source.extractfile(member) as stream:
                          for block in iter(lambda: stream.read(1024 * 1024), b''): digest.update(block)
                      dependencies[pathlib.Path(name).name] = digest.hexdigest()
          assert source_info and os.environ['VALIDATED_SHA'] in source_info
          assert inventory and len(inventory['components']) >= 36
          for component in inventory['components']:
              assert dependencies[pathlib.Path(component['archive']).name] == component['sha256'], component['name']
          for path in ['macos-native/Sources/MoonlightLGApp.swift', 'scripts/build-native-macos.sh', 'third-party-source/qtbase.tar.gz', 'third-party-source/SOURCES.json']:
              assert prefix + path in names, 'Incomplete corresponding source: ' + path
          for path in ['moonlight-common-c/moonlight-common-c/', 'moonlight-common-c/moonlight-common-c/enet/', 'moonlight-common-c/moonlight-common-c/nanors/', 'qmdnsengine/qmdnsengine/', 'app/SDL_GameControllerDB/', 'h264bitstream/']:
              assert any(name.startswith(prefix + path) for name in files), 'Missing bundled submodule source: ' + path
          with zipfile.ZipFile(root / f"MoonlightLG-{os.environ['VERSION']}-arm64.zip") as package:
              info = plistlib.loads(package.read('MoonlightLG.app/Contents/Info.plist'))
              assert (info['MoonlightLGVersion'], info['MoonlightLGReleaseChannel'], info['CFBundleVersion']) == (os.environ['VERSION'], 'stable', '61')
              count = 0
              for name in package.namelist():
                  if package.getinfo(name).file_size < 8: continue
                  with package.open(name) as stream: header = stream.read(4096)
                  magic = header[:4].hex()
                  if magic in ['cffaedfe', 'cefaedfe', 'feedfacf', 'feedface']:
                      endian = '<' if magic.startswith(('cf', 'ce')) else '>'
                      assert struct.unpack(endian + 'I', header[4:8])[0] == 0x100000c, name
                      count += 1
                  elif magic in ['cafebabe', 'cafebabf', 'bebafeca', 'bfbafeca']:
                      endian = '>' if magic.startswith('ca') else '<'
                      stride = 32 if magic in ['cafebabf', 'bfbafeca'] else 20
                      slices = struct.unpack(endian + 'I', header[4:8])[0]
                      assert 0 < slices < 128
                      assert all(struct.unpack(endian + 'I', header[8+i*stride:12+i*stride])[0] == 0x100000c for i in range(slices)), name
                      count += 1
              assert count == 107, count
          print(f"Verified {count} ARM64-only Mach-O files and {len(inventory['components'])} dependency source archives")
          captures = pathlib.Path('capture-assets')
          attachments = [a for test in json.loads((captures / 'manifest.json').read_text()) for a in test['attachments']]
          for name in ['main-dark', 'main-compact', 'settings-video', 'native-startup-warp', 'about-dark']:
              matches = [a for a in attachments if a['suggestedHumanReadableName'].startswith(name + '_0_')]
              assert len(matches) == 1, name
              shutil.copyfile(captures / matches[0]['exportedFileName'], root / (name + '.png'))
          overlays = list(pathlib.Path('overlay-assets').rglob('overlay-controls-dark.png'))
          assert len(overlays) == 1, overlays
          shutil.copyfile(overlays[0], root / 'overlay-controls-dark.png')
          PY
          cat release-assets/SHA256SUMS.txt
      - name: Stage verified release notes
        run: cp docs/RELEASE_1.3.7.1.md release-assets/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v6
        id: bundle
        with:
          name: MoonlightLG-1.3.7.1-Release-Ready
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATED_SHA: 22e329f252591b0c6b552ded511c6450b107a1ea
      RELEASE_TAG: moonlightlg-v1.3.7.1
      PREP_ARTIFACT: ${{ needs.prepare.outputs.artifact-id }}
      PREP_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
    steps:
      - name: Verify and download the staged bundle
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feature/recording-plugin" --jq .object.sha)" = "$GITHUB_SHA"
          artifact="repos/$GH_REPO/actions/artifacts/$PREP_ARTIFACT"
          test "$(gh api "$artifact" --jq .digest)" = "sha256:${PREP_DIGEST#sha256:}"
          test "$(gh api "$artifact" --jq .workflow_run.id)" = "$GITHUB_RUN_ID"
          test "$(gh api "$artifact" --jq .expired)" = false
          gh run download "$GITHUB_RUN_ID" --name MoonlightLG-1.3.7.1-Release-Ready --dir release-assets
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Create a draft and verify its uploaded assets
        run: |
          test "$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")" = ''
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")" = ''
          assets=(
            release-assets/MoonlightLG-1.3.7.1-arm64.zip
            release-assets/MoonlightLG-1.3.7.1-source.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/LICENSE.txt
            release-assets/THIRD_PARTY_NOTICES.txt
            release-assets/SOURCE_MANIFEST.json
            release-assets/main-dark.png
            release-assets/main-compact.png
            release-assets/settings-video.png
            release-assets/native-startup-warp.png
            release-assets/about-dark.png
            release-assets/overlay-controls-dark.png
          )
          sha256sum "${assets[@]}" > /tmp/release-assets.sha256
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
            --title '🌙 MoonlightLG 1.3.7.1 · Crimson Glass' \
            --notes-file release-assets/RELEASE_NOTES.md "${assets[@]}"
          release_id="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" > /tmp/draft-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/draft-release.json').read_text())
          assert release['draft']
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          expected = {}
          for line in Path('/tmp/release-assets.sha256').read_text().splitlines():
              digest, path = line.split('  ', 1)
              expected[Path(path).name] = 'sha256:' + digest
          actual = {asset['name']: asset['digest'] for asset in release['assets'] if asset['state'] == 'uploaded'}
          assert actual == expected, (actual, expected)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
