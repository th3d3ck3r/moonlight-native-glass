name: Native macOS Validation
on:
  push:
    branches: [native-ui]
    paths-ignore: [README.md, "docs/**", "readme-assets/**", .github/workflows/publish-native-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # UI probes compile/render the actual native frontend quickly. A final
    # ordinary push must pass both complete builds before any release.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, universal]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Verify streaming baseline
        run: |
          git fetch --no-tags --depth=1 origin de2467e433821664cdd2224aad8c89a625be1ad9
          python3 tests/native/check_streaming_boundary.py
          xcodebuild -version
      # Exercise process/cancellation failures before the full engine build.
      - name: Test native event framing
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift tests/native/EngineProtocolTests.swift -o build/engine-protocol-tests
          build/engine-protocol-tests
      - name: Test frontend engine failure recovery
        if: matrix.architecture == 'universal'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/EngineStore.swift tests/native/EngineStoreTests.swift -o build/engine-store-tests
          build/engine-store-tests
      - name: Test native overlays and capture composited previews
        if: matrix.architecture == 'universal'
        run: |
          python3 setup-deps.py
          mkdir -p build/overlay-previews
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/OverlayTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/overlay-tests
          build/overlay-tests build/overlay-previews
      - name: Test fullscreen startup, Metal presentation and captured hide/restore
        if: matrix.architecture == 'universal'
        run: |
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/FullscreenWindowTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework QuartzCore -framework Metal \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/fullscreen-window-tests
          build/fullscreen-window-tests 0 build/fullscreen-previews/fullscreen
          build/fullscreen-window-tests 1 build/fullscreen-previews/borderless
      - name: Test actual SDL stream window hide and restore
        if: matrix.architecture == 'universal'
        run: |
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/StreamWindowTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/stream-window-tests
          build/stream-window-tests
      - uses: actions/upload-artifact@v6
        if: always() && matrix.architecture == 'universal'
        with:
          name: Native-Fullscreen-Previews
          path: build/fullscreen-previews/**/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: matrix.architecture == 'universal'
        with:
          name: Native-Stream-Overlay-Previews
          path: build/overlay-previews/*.png
          if-no-files-found: error
      - name: Build app and verify bundle
        run: bash scripts/build-native-macos.sh '${{ matrix.architecture }}'
      - name: Test real engine bridge and persistence
        if: matrix.architecture == 'universal'
        env:
          MOONLIGHT_NATIVE_DIAGNOSTIC_DYLIB: ${{ github.workspace }}/build/helper-backtrace.dylib
          MOONLIGHT_NATIVE_SHUTDOWN_CYCLES: '100'
        run: |
          mkdir -p build/previews
          xcrun clang++ -std=c++17 -dynamiclib -undefined dynamic_lookup -g tests/native/NativeCrashTrace.cpp -o build/helper-backtrace.dylib
          python3 tests/native/bridge_smoke.py 'build/native-universal/Moonlight Native Glass.app/Contents/Helpers/MoonlightEngine.app/Contents/MacOS/Moonlight' build/previews/settings-fixture.json
          env -u MOONLIGHT_NATIVE_DIAGNOSTIC_DYLIB python3 tests/native/bridge_smoke.py 'build/native-universal/Moonlight Native Glass.app/Contents/Helpers/MoonlightEngine.app/Contents/MacOS/Moonlight'
      - name: Test actual menu bar icon state
        if: matrix.architecture == 'universal'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/NativeStatusMenu.swift tests/native/StatusIconTests.swift -o build/status-icon-tests
          build/status-icon-tests macos-native/Resources build/status-icon-previews
      - uses: actions/upload-artifact@v6
        if: matrix.architecture == 'universal'
        with:
          name: Native-Status-Icon-Previews
          path: build/status-icon-previews/*.png
          if-no-files-found: error
      - name: Package preview artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'build/native-${{ matrix.architecture }}/Moonlight Native Glass.app' 'build/Moonlight-Native-Glass-Preview-16-${{ matrix.architecture }}.zip'
          shasum -a 256 'build/Moonlight-Native-Glass-Preview-16-${{ matrix.architecture }}.zip' > 'build/SHA256-${{ matrix.architecture }}.txt'
      - uses: actions/upload-artifact@v6
        with:
          name: Native-Glass-Preview-16-${{ matrix.architecture }}
          path: |
            build/Moonlight-Native-Glass-Preview-16-${{ matrix.architecture }}.zip
            build/SHA256-${{ matrix.architecture }}.txt
          if-no-files-found: error

  # Capture native screens; verify Dock reopen/relaunch and status-item Settings/Quit.
  native-windows:
    name: Native UI window smoke test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Test menu and thumbnail lifecycle before UI capture
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/NativeStatusMenu.swift tests/native/StatusIconTests.swift -o build/status-icon-tests
          build/status-icon-tests macos-native/Resources
      - name: Capture composited native UI with XCTest
        run: |
          xcodebuild -project tests/native/NativeUITests.xcodeproj -scheme NativeUITests -destination 'platform=macOS' -derivedDataPath build/ui-tests -resultBundlePath build/native-ui.xcresult test
      - name: Collect native screenshots
        if: always()
        run: |
          mkdir -p build/previews
          xcrun xcresulttool export attachments --path build/native-ui.xcresult --output-path build/previews
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Native-UI-Quick-Window-Captures
          path: build/previews/*
          if-no-files-found: warn
