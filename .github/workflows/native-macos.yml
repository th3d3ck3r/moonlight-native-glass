name: Native macOS Validation
on:
  push:
    branches: [native-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, universal]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Verify streaming baseline
        run: |
          git fetch --no-tags --depth=1 origin de2467e433821664cdd2224aad8c89a625be1ad9
          git diff --exit-code de2467e433821664cdd2224aad8c89a625be1ad9 -- app/streaming app/backend app/settings moonlight-common-c qmdnsengine
          xcodebuild -version
      - name: Build app and verify bundle
        run: bash scripts/build-native-macos.sh '${{ matrix.architecture }}'
      - name: Test native event framing
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift tests/native/EngineProtocolTests.swift -o build/engine-protocol-tests
          build/engine-protocol-tests
      - name: Test real engine bridge and persistence
        if: matrix.architecture == 'universal'
        run: |
          mkdir -p build/previews
          python3 tests/native/bridge_smoke.py 'build/native-universal/Moonlight Native Glass.app/Contents/Helpers/MoonlightEngine.app/Contents/MacOS/Moonlight' build/previews/settings-fixture.json
      - name: Capture native windows, sheets, settings and compact layout
        if: matrix.architecture == 'universal'
        run: |
          mkdir -p build/previews
          app='build/native-universal/Moonlight Native Glass.app/Contents/MacOS/MoonlightNative'
          python3 tests/native/capture_windows.py "$app" "$PWD/build/previews"
          test -s build/previews/main-light.png
          test -s build/previews/main-dark.png
          test -s build/previews/main-compact.png
      - uses: actions/upload-artifact@v6
        if: always() && matrix.architecture == 'universal'
        with:
          name: Native-UI-Window-Captures
          path: build/previews/*
          if-no-files-found: warn
      - name: Package preview artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'build/native-${{ matrix.architecture }}/Moonlight Native Glass.app' 'build/Moonlight-Native-Glass-Preview-1-${{ matrix.architecture }}.zip'
          shasum -a 256 'build/Moonlight-Native-Glass-Preview-1-${{ matrix.architecture }}.zip' > 'build/SHA256-${{ matrix.architecture }}.txt'
      - uses: actions/upload-artifact@v6
        with:
          name: Native-Glass-Preview-1-${{ matrix.architecture }}
          path: |
            build/Moonlight-Native-Glass-Preview-1-${{ matrix.architecture }}.zip
            build/SHA256-${{ matrix.architecture }}.txt
            build/previews/*.png
          if-no-files-found: error

  native-windows:
    name: Native UI window smoke test
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Compile the native frontend for rapid UI feedback
        run: |
          app="$PWD/build/window-smoke/Moonlight Native Glass.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" build/previews
          xcrun swiftc -swift-version 5 -parse-as-library -O -sdk "$(xcrun --sdk macosx --show-sdk-path)" -target arm64-apple-macos15.0 macos-native/Sources/*.swift -o "$app/Contents/MacOS/MoonlightNative"
          cp macos-native/Info.plist "$app/Contents/Info.plist"
          cp app/moonlight.icns "$app/Contents/Resources/moonlight.icns"
          codesign --force --sign - "$app"
          cp tests/native/preview-settings.json build/previews/settings-fixture.json
          python3 tests/native/capture_windows.py "$app/Contents/MacOS/MoonlightNative" "$PWD/build/previews"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Native-UI-Quick-Window-Captures
          path: build/previews/*
          if-no-files-found: warn
