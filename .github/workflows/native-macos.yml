name: MoonlightLG macOS Validation
on:
  push:
    branches: [native-ui, feature/native-boot-animation, feature/recording-plugin]
    paths-ignore: [README.md, "docs/**", "readme-assets/**", .github/workflows/publish-native-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  touchbar:
    name: Touch Bar layout, controls and ownership
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Test library and Apollo Touch Bar action gating
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/NativeCrimsonTheme.swift macos-native/Sources/NativeConnectionView.swift tests/native/TouchBarFrontendTests.swift -o build/touchbar-frontend-tests
          build/touchbar-frontend-tests
      - name: Test stream Touch Bar routing, state, layout and lifetime
        run: |
          python3 setup-deps.py
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/TouchBarTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework IOKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/touchbar-tests
          build/touchbar-tests build/touchbar-previews
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Native-Touch-Bar-Previews
          path: build/touchbar-previews/*.png
          if-no-files-found: warn
  build:
    # UI probes compile/render the actual native frontend quickly. A final
    # ordinary push must pass both complete builds before any release.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ui probe]')
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64, universal]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Verify streaming baseline
        run: |
          git fetch --no-tags --depth=1 origin de2467e433821664cdd2224aad8c89a625be1ad9
          python3 tests/native/check_streaming_boundary.py
          xcodebuild -version
      # Exercise process/cancellation failures before the full engine build.
      - name: Test production Apollo connection gate
        run: |
          python3 tests/native/LegalNoticesTests.py
          python3 tests/native/extract_native_exit_shortcut.py
          c++ -std=c++17 -Ibuild tests/native/ConnectionGateTests.cpp -o build/connection-gate-tests
          build/connection-gate-tests
          python3 tests/native/extract_native_audio_callback.py
          c++ -std=c++17 -Ibuild tests/native/AudioMuteTests.cpp -o build/audio-mute-tests
          build/audio-mute-tests
          c++ -std=c++17 tests/native/StreamStatsTests.cpp -o build/stream-stats-tests
          build/stream-stats-tests
      - name: Test native event framing
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift tests/native/EngineProtocolTests.swift -o build/engine-protocol-tests
          build/engine-protocol-tests
      - name: Test frontend engine failure recovery
        if: matrix.architecture == 'universal'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/EngineStore.swift tests/native/EngineStoreTests.swift -o build/engine-store-tests
          build/engine-store-tests
      - name: Test native startup animation and window chrome recovery
        if: matrix.architecture == 'universal'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/NativeCrimsonTheme.swift macos-native/Sources/NativeBootPresentation.swift tests/native/BootPlaybackTests.swift -o build/boot-playback-tests
          build/boot-playback-tests "$PWD/macos-native/Resources/boot-moon.png"
      - name: Test Apollo inside the actual stream window
        if: matrix.architecture == 'universal'
        run: |
          python3 setup-deps.py
          python3 scripts/build-connection-view.py build/libMoonlightLGConnection.dylib arm64
          mkdir -p build/connection-window-qt
          (cd build/connection-window-qt && qmake ../../tests/native/ConnectionWindowTests.pro QMAKE_APPLE_DEVICE_ARCHS=arm64 && make -j4)
          MOONLIGHT_NATIVE_CONNECTION_LIBRARY="$PWD/build/libMoonlightLGConnection.dylib" build/connection-window-qt/connection-window-tests build/connection-window-previews
      - name: Test recording plugin and decode recorded files
        if: matrix.architecture == 'universal'
        run: |
          python3 scripts/build-recorder-plugin.py build/libMoonlightLGRecorder.dylib arm64
          xcrun clang++ -std=c++17 -pthread tests/native/RecorderCoreTests.cpp -o build/recorder-core-tests
          build/recorder-core-tests
          xcrun clang++ -std=c++17 -fobjc-arc -I libs/mac/include tests/native/RecorderTests.mm \
            -L libs/mac/lib -lopus.0 -framework Foundation -framework AVFoundation \
            -framework VideoToolbox -framework CoreMedia -framework CoreVideo -framework AudioToolbox \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/recorder-tests
          DYLD_LIBRARY_PATH="$PWD/libs/mac/lib" build/recorder-tests "$PWD/build/libMoonlightLGRecorder.dylib" "$PWD/build/recording-fixtures"
      - name: Test native overlays and capture composited previews
        if: matrix.architecture == 'universal'
        run: |
          python3 setup-deps.py
          mkdir -p build/overlay-previews
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/OverlayTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework IOKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/overlay-tests
          build/overlay-tests build/overlay-previews
      - name: Test fullscreen startup, Metal presentation and captured hide/restore
        if: matrix.architecture == 'universal'
        run: |
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/FullscreenWindowTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework IOKit -framework QuartzCore -framework Metal \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/fullscreen-window-tests
          build/fullscreen-window-tests 0 build/fullscreen-previews/fullscreen
          build/fullscreen-window-tests 1 build/fullscreen-previews/borderless
      - name: Test actual SDL stream window hide and restore
        if: matrix.architecture == 'universal'
        run: |
          python3 tests/native/extract_native_focus_methods.py
          xcrun clang++ -std=c++17 -fno-objc-arc -I libs/mac/include/SDL2 -I app/native -I build \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/StreamWindowTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework IOKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/stream-window-tests
          python3 tests/native/run_window_probe.py build/stream-window-tests
      - name: Audit native window and input lifetime with sanitizers
        if: matrix.architecture == 'universal'
        run: |
          xcrun clang++ -std=c++17 -fno-objc-arc -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I libs/mac/include/SDL2 -I app/native -I build \
            app/native/nativeapplication.mm app/native/nativeoverlay.mm app/native/nativetitlebar.mm tests/native/StreamWindowTests.mm \
            -L libs/mac/lib -lSDL2 -framework AppKit -framework IOKit -framework QuartzCore \
            -Wl,-rpath,"$PWD/libs/mac/lib" -o build/stream-window-sanitizer-tests
          ASAN_OPTIONS=detect_leaks=0 build/stream-window-sanitizer-tests
      - uses: actions/upload-artifact@v6
        if: always() && matrix.architecture == 'universal'
        with:
          name: Native-Fullscreen-Previews
          path: |
            build/fullscreen-previews/**/*.png
            build/window-probe-sample.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: matrix.architecture == 'universal'
        with:
          name: Native-Stream-Overlay-Previews
          path: |
            build/overlay-previews/*.png
            build/connection-window-previews/*.png
          if-no-files-found: error
      - name: Build app and verify bundle
        run: bash scripts/build-native-macos.sh '${{ matrix.architecture }}'
      - name: Verify packaged stream window opens before connecting
        if: matrix.architecture != 'x86_64'
        run: python3 tests/native/connection_window_bridge.py 'build/native-${{ matrix.architecture }}/MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/MacOS/Moonlight'
      - name: Test real engine bridge and persistence
        if: matrix.architecture != 'x86_64'
        env:
          MOONLIGHT_NATIVE_DIAGNOSTIC_DYLIB: ${{ github.workspace }}/build/helper-backtrace.dylib
          MOONLIGHT_NATIVE_SHUTDOWN_CYCLES: '100'
        run: |
          mkdir -p build/previews
          xcrun clang++ -std=c++17 -dynamiclib -undefined dynamic_lookup -g tests/native/NativeCrashTrace.cpp -o build/helper-backtrace.dylib
          python3 tests/native/bridge_smoke.py 'build/native-${{ matrix.architecture }}/MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/MacOS/Moonlight' build/previews/settings-fixture.json
          env -u MOONLIGHT_NATIVE_DIAGNOSTIC_DYLIB python3 tests/native/bridge_smoke.py 'build/native-${{ matrix.architecture }}/MoonlightLG.app/Contents/Helpers/MoonlightLGEngine.app/Contents/MacOS/Moonlight'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: Native-Helper-Crash-Reports-${{ matrix.architecture }}
          path: ~/Library/Logs/DiagnosticReports/*Moonlight*.ips
          if-no-files-found: warn
      - name: Test actual menu bar icon state
        if: matrix.architecture == 'universal'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/NativeCrimsonTheme.swift macos-native/Sources/NativeStatusMenu.swift tests/native/StatusIconTests.swift -o build/status-icon-tests
          build/status-icon-tests macos-native/Resources build/status-icon-previews
      - uses: actions/upload-artifact@v6
        if: matrix.architecture == 'universal'
        with:
          name: Native-Status-Icon-Previews
          path: build/status-icon-previews/*.png
          if-no-files-found: error
      - name: Package versioned artifact
        id: package
        run: |
          version=$(python3 scripts/moonlightlg-version.py 'build/native-${{ matrix.architecture }}/MoonlightLG.app/Contents/Info.plist')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent 'build/native-${{ matrix.architecture }}/MoonlightLG.app' "build/MoonlightLG-$version-${{ matrix.architecture }}.zip"
          shasum -a 256 "build/MoonlightLG-$version-${{ matrix.architecture }}.zip" > 'build/SHA256-${{ matrix.architecture }}.txt'
      - name: Package corresponding application and dependency sources
        if: matrix.architecture == 'arm64'
        run: |
          python3 scripts/package-release-source.py 'build/MoonlightLG-${{ steps.package.outputs.version }}-source.tar.gz'
          shasum -a 256 'build/MoonlightLG-${{ steps.package.outputs.version }}-source.tar.gz' > build/SHA256-source.txt
      - uses: actions/upload-artifact@v6
        if: matrix.architecture == 'arm64'
        with:
          name: MoonlightLG-${{ steps.package.outputs.version }}-source
          path: |
            build/MoonlightLG-*-source.tar.gz
            build/SHA256-source.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: MoonlightLG-${{ steps.package.outputs.version }}-${{ matrix.architecture }}
          path: |
            build/MoonlightLG-*-${{ matrix.architecture }}.zip
            build/SHA256-${{ matrix.architecture }}.txt
          if-no-files-found: error

  # Capture native screens; verify Dock reopen/relaunch and status-item Settings/Quit.
  native-windows:
    name: MoonlightLG UI window smoke test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Test menu, restore and removed hover before UI capture
        run: |
          mkdir -p build
          xcrun swift -e 'import AppKit; print("Runner Reduce Motion:", NSWorkspace.shared.accessibilityDisplayShouldReduceMotion)'
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/NativeCrimsonTheme.swift macos-native/Sources/NativeStatusMenu.swift tests/native/StatusIconTests.swift -o build/status-icon-tests
          build/status-icon-tests macos-native/Resources
      - name: Test frontend lifecycle during UI probes
        if: contains(github.event.head_commit.message, '[ui probe]')
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/EngineProtocol.swift macos-native/Sources/EngineStore.swift tests/native/EngineStoreTests.swift -o build/engine-store-tests
          build/engine-store-tests
      - name: Test native startup animation and window chrome recovery
        # Startup lifetime checks also run in UI-only probes, before screenshots.
        # Compile the same production coordinator used by the actual app.
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library macos-native/Sources/NativeCrimsonTheme.swift macos-native/Sources/NativeBootPresentation.swift tests/native/BootPlaybackTests.swift -o build/boot-playback-tests
          build/boot-playback-tests "$PWD/macos-native/Resources/boot-moon.png"
      - name: Capture native screens with XCTest
        run: |
          xcodebuild -project tests/native/NativeUITests.xcodeproj -scheme NativeUITests -destination 'platform=macOS' -derivedDataPath build/ui-tests -resultBundlePath build/native-ui.xcresult test
      - name: Collect native screenshots
        if: always()
        run: |
          mkdir -p build/previews
          xcrun xcresulttool export attachments --path build/native-ui.xcresult --output-path build/previews
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Native-UI-Quick-Window-Captures
          path: build/previews/*
          if-no-files-found: warn

