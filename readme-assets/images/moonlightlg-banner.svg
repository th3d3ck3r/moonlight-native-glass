    <text x="290" y="160" font-size="49" font-weight="700" fill="#f4f8ff">MoonlightLG</text>
    <text x="294" y="198" font-size="21" fill="#b2c8db">SwiftUI + AppKit. Moonlight Qt 6.2 streaming.</text>
    <rect x="294" y="224" width="224" height="32" rx="16" fill="#2c0d19" stroke="#356375"/>
    <text x="406" y="245" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#a9e4ee">INTEL + APPLE SILICON</text>
    <rect x="530" y="224" width="170" height="32" rx="16" fill="#25111b" stroke="#4b5e7c"/>
    <text x="615" y="245" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#cbd5fa">MANUAL UPDATES</text>
  </g>
