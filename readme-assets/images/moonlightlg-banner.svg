<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">MoonlightLG — English Manual Edition</title>
  <desc id="desc">Native streaming for Intel and Apple Silicon Macs. Liquid Glass navigation. English interface and manual updates.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08080b"/><stop offset="1" stop-color="#270b16"/></linearGradient>
    <linearGradient id="moon"><stop stop-color="#ff496b"/><stop offset="1" stop-color="#a10c3a"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#bg)" stroke="#52202d"/>
  <circle cx="1060" cy="75" r="160" fill="#d9234e" opacity=".07"/>
  <circle cx="1070" cy="210" r="185" fill="#f94165" opacity=".04"/>
  <path d="M197 70a84 84 0 1 0 0 160 88 88 0 0 1 0-160Z" fill="url(#moon)"/>
  <circle cx="228" cy="83" r="4" fill="#a9d7ed"/>
  <circle cx="249" cy="115" r="2.5" fill="#a9d7ed"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
